# Experiment A4 (HEADLINE): all 8 MRI phases
# Combines dynamic contrast, functional (DWI), structural (T2WI),
# and in/out-of-phase (fat characterisation).
name: ablation_all_8
phases:
  - C-pre
  - C+A
  - C+V
  - C+Delay
  - T2WI
  - DWI
  - InPhase
  - OutPhase

manifest: data/manifest.csv
cache_dir: data_cache
seed: 42

batch_size: 32
learning_rate: 0.001
weight_decay: 0.01
max_epochs: 60
early_stopping_patience: 10
num_workers: 4
