# Experiment A2: pre-contrast + arterial phase
# Clinical hypothesis: arterial-phase hyperenhancement is the hallmark of HCC.
# Adding C-pre as baseline gives relative enhancement signal.
name: ablation_pre_a
phases:
  - C-pre
  - C+A

manifest: data/manifest.csv
cache_dir: data_cache
seed: 42

batch_size: 32
learning_rate: 0.001
weight_decay: 0.01
max_epochs: 60
early_stopping_patience: 10
num_workers: 4
